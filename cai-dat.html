<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt kế toán</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body data-page="cai-dat" class="opacity-0 transition-opacity">

<div id="page">
  <!-- Menu con nằm ở sidebar (thay menu chính), xem window.APP_SUBMENU bên dưới -->
  <nav class="mb-4 flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
    <span>Cài đặt kế toán</span><i data-icon="chevronRight" class="h-3.5 w-3.5"></i><span id="crumb-sub"></span>
  </nav>
  <section id="panel" class="min-w-0"></section>
</div>

<!-- Modal dùng chung cho thêm / sửa -->
<div data-modal="modal-form" class="fixed inset-0 z-[60] hidden">
  <div data-modal-backdrop class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
  <div class="pointer-events-none absolute inset-0 flex items-end justify-center sm:items-center sm:p-4">
    <div class="modal-in pointer-events-auto flex max-h-[92vh] w-full flex-col rounded-t-2xl bg-white shadow-2xl dark:bg-slate-900 sm:max-w-lg sm:rounded-2xl">
      <div class="flex items-center justify-between border-b border-slate-200 px-5 py-4 dark:border-slate-800">
        <h3 id="form-title" class="font-semibold text-slate-900 dark:text-white"></h3>
        <button data-close class="btn-icon"><i data-icon="x" class="h-5 w-5"></i></button>
      </div>
      <div id="form-body" class="space-y-4 overflow-y-auto px-5 py-4"></div>
      <div class="flex justify-end gap-2 border-t border-slate-200 px-5 py-3 dark:border-slate-800">
        <button class="btn" data-close>Huỷ</button>
        <button class="btn-primary" data-close id="form-save">Lưu</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal xác nhận xoá -->
<div data-modal="modal-del" class="fixed inset-0 z-[60] hidden">
  <div data-modal-backdrop class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
  <div class="pointer-events-none absolute inset-0 flex items-end justify-center sm:items-center sm:p-4">
    <div class="modal-in pointer-events-auto w-full rounded-t-2xl bg-white p-5 shadow-2xl dark:bg-slate-900 sm:max-w-sm sm:rounded-2xl">
      <div class="flex gap-3">
        <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300"><i data-icon="trash" class="h-5 w-5"></i></span>
        <div><h3 class="font-semibold text-slate-900 dark:text-white">Xoá mục này?</h3>
          <p id="del-text" class="mt-1 text-sm text-slate-500 dark:text-slate-400"></p></div>
      </div>
      <div class="mt-5 flex justify-end gap-2">
        <button class="btn" data-close>Huỷ</button>
        <button class="btn-danger" data-close onclick="App.toast('Đã xoá')">Xoá</button>
      </div>
    </div>
  </div>
</div>

  var KQKD = [

  // ------------------------------------------------------------ Thành phần
  function header(title, desc, actions) {
    return '<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">' +

  }

      '<input class="inp pl-9" placeholder="' + E(ph) + '" data-filter="' + target + '"></div>';
  }
  function addBtn(label, form) {
    return '<button class="btn-primary" data-form="' + form + '">' + I('plus', 'h-4 w-4') + E(label) + '</button>';
  }
  function actions(name, form) {

  }

    return '<div class="card overflow-hidden"><div class="max-h-[70vh] overflow-auto scrollbar-thin"><table class="tbl"><thead><tr>' +

      '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div></div>';
  }

  function reportLines(title, desc, lines, hasBold) {

        '<td class="' + (bold ? 'font-semibold text-slate-900 dark:text-white' : '') + '">' + E(r[1]) + '</td>' +
        '<td class="hidden md:table-cell">' + (r[2] ? r[2].split(', ').map(function (x) { return chip(x, 'bg-sky-50 text-sky-700 dark:bg-sky-500/10 dark:text-sky-300'); }).join(' ') : chip('')) + '</td>' +
        '<td class="hidden md:table-cell">' + (r[3] ? chip(r[3], 'bg-orange-50 text-orange-700 dark:bg-orange-500/10 dark:text-orange-300') : chip('')) + '</td>' +

        '<td>' + actions(r[1], 'line') + '</td></tr>';

      table([['Mã số', 'w-20'], ['Chỉ tiêu'], ['TK ghi Nợ', 'hidden md:table-cell'], ['TK ghi Có', 'hidden md:table-cell'], ['Công thức'], ['', 'w-24']], rows);

        '<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-300 p-2.5 has-[:checked]:border-rose-500 has-[:checked]:bg-rose-50 dark:border-slate-700 dark:has-[:checked]:bg-rose-500/10"><input type="radio" name="t" class="accent-rose-600">Phiếu chi</label></div></div>' +
        App.field('Tài khoản đối ứng', '<input class="inp" list="acc-list" placeholder="Gõ số hiệu hoặc tên TK…">' + accList()) +
        App.field('Tên mẫu', '<input class="inp" placeholder="vd: Thu tiền đơn hàng">');
    }],
    acc: ['Tài khoản', function () {
      return '<div class="grid gap-4 sm:grid-cols-2">' + App.field('Số hiệu TK', '<input class="inp font-mono" placeholder="vd: 1121035">') +
        App.field('Tài khoản mẹ', '<input class="inp font-mono" list="acc-list" placeholder="vd: 112">' + accList()) + '</div>' +
        App.field('Tên tài khoản', '<input class="inp">') +
        '<div class="grid gap-4 sm:grid-cols-3">' + App.field('Loại TK', '<select class="inp"><option>Dư Nợ</option><option>Dư Có</option><option>Lưỡng tính</option><option>Không số dư</option></select>') +
        App.field('Mã cấp Nợ', '<input class="inp font-mono">') + App.field('Mã cấp Có', '<input class="inp font-mono">') + '</div>' +
        App.field('Mã P&L', '<select class="inp"><option value="">— Không —</option>' + PL.map(function (p) { return '<option>' + p[0] + ' – ' + E(p[1]) + '</option>'; }).join('') + '</select>') +
        '<div class="flex flex-col gap-2"><label class="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2.5 dark:border-slate-700"><span class="text-sm">Là tài khoản mẹ</span>' + sw(false) + '</label>' +
        '<label class="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2.5 dark:border-slate-700"><span><span class="block text-sm">Đối chiếu thuế</span><span class="block text-xs text-slate-500">Đồng bộ phát sinh của TK này sang sổ thuế</span></span>' + sw(false) + '</label>' +
        '<label class="flex items-center justify-between rounded-lg border border-slate-200 px-3 py-2.5 dark:border-slate-700"><span class="text-sm">Khoá tài khoản</span>' + sw(false) + '</label></div>';
    }],
    period: ['Kỳ kế toán', function () {
      return App.field('Tên kỳ', '<input class="inp" placeholder="vd: Quý 1/2027">') +
        '<div class="grid gap-4 sm:grid-cols-2">' + App.field('Ngày bắt đầu', '<input type="date" class="inp">') + App.field('Ngày kết thúc', '<input type="date" class="inp">') + '</div>';
    }],
    carry: ['Dòng kết chuyển', function () {
      return App.field('Diễn giải', '<input class="inp">') + '<div class="grid gap-4 sm:grid-cols-3">' +
        App.field('TK Nợ', '<input class="inp font-mono" list="acc-list">' + accList()) + App.field('TK Có', '<input class="inp font-mono" list="acc-list">') +
        App.field('Thứ tự', '<input type="number" class="inp" value="8">') + '</div>';
    }],
    general: ['Cấu hình bảng tổng hợp', function () {
      return App.field('Tên', '<input class="inp">') + '<div class="grid gap-4 sm:grid-cols-2">' +
        App.field('Sổ', '<select class="inp"><option>Sổ kế toán · 2026</option><option>Sổ kế toán · 2025</option></select>') +
        App.field('Tài khoản', '<input class="inp font-mono" list="acc-list">' + accList()) + '</div>' +
        App.field('Chu kỳ', '<select class="inp"><option>Hàng tháng</option><option>Hàng quý</option></select>') +
        '<div class="grid gap-4 sm:grid-cols-2">' + App.field('Từ ngày', '<input type="date" class="inp">') + App.field('Đến ngày', '<input type="date" class="inp">') + '</div>';
    }],
    line: ['Chỉ tiêu báo cáo', function () {
      return '<div class="grid gap-4 sm:grid-cols-3">' + App.field('Mã số', '<input class="inp font-mono">') + '<div class="sm:col-span-2">' + App.field('Tên chỉ tiêu', '<input class="inp">') + '</div></div>' +
        '<div class="grid gap-4 sm:grid-cols-2">' + App.field('TK ghi Nợ', '<input class="inp font-mono" placeholder="111, 112">', 'Nhiều TK cách nhau dấu phẩy') + App.field('TK ghi Có', '<input class="inp font-mono">') + '</div>' +

    }],
    pl: ['Dòng P&L', function () { return '<div class="grid gap-4 sm:grid-cols-3">' + App.field('Mã', '<input class="inp font-mono">') + '<div class="sm:col-span-2">' + App.field('Tên dòng', '<input class="inp">') + '</div></div>' + App.field('Tài khoản', '<input class="inp font-mono" placeholder="6417, 6418">'); }],
    ccdc: ['Danh mục CCDC', function () { return App.field('Tên danh mục', '<input class="inp">'); }],

  };
  function accList() {
    return '<datalist id="acc-list">' + ACCOUNTS.map(function (a) { return '<option value="' + a[0] + '">' + E(a[1]) + '</option>'; }).join('') + '</datalist>';
  }

  // ------------------------------------------------------------ Điều hướng
  function show(id) {
    if (!PANELS[id]) id = 'mau-phieu';
    document.getElementById('panel').innerHTML = PANELS[id]();
    var item = SUB.filter(function (s) { return s.id === id; })[0];
    document.getElementById('crumb-sub').textContent = item.t;
    document.title = item.t + ' · Cài đặt kế toán';
    App.setSubActive(id);
  }

  document.addEventListener('DOMContentLoaded', function () {
    window.addEventListener('hashchange', function () { show(location.hash.slice(1)); });
    show(location.hash.slice(1));

    document.addEventListener('click', function (e) {
      var f = e.target.closest('[data-form]');
      if (f) {
        var def = FORMS[f.dataset.form];
        var name = f.dataset.name;
        document.getElementById('form-title').textContent = (name ? 'Sửa ' : 'Thêm ') + def[0].toLowerCase();
        document.getElementById('form-body').innerHTML = def[1]();
        document.getElementById('form-save').onclick = function () { App.toast(name ? 'Đã lưu thay đổi' : 'Đã thêm mới'); };
        App.openModal('modal-form');
        return;
      }
      var d = e.target.closest('[data-del]');
      if (d) { document.getElementById('del-text').textContent = '“' + d.dataset.del + '” sẽ bị xoá vĩnh viễn.'; App.openModal('modal-del'); return; }
      var s = e.target.closest('[data-switch]');
      if (s) { s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true'); return; }
      var t = e.target.closest('[data-toggle]');
      if (t) {
        // Thu gọn / mở các TK con ngay sau TK mẹ
        var tr = t.closest('tr'), open = !t.classList.contains('closed');
        t.classList.toggle('closed', open);
        t.querySelector('svg').style.transform = open ? 'rotate(-90deg)' : '';
        var n = tr.nextElementSibling;
        while (n && n.dataset.lv !== '0') { n.style.display = open ? 'none' : ''; n = n.nextElementSibling; }
        return;
      }
      var tb = e.target.closest('#tpl-tabs [data-t]');
      if (tb) {
        tb.parentNode.querySelectorAll('button').forEach(function (b) { b.className = 'rounded-md px-3 py-1.5 ' + (b === tb ? 'bg-white shadow-sm dark:bg-slate-700' : 'text-slate-500 dark:text-slate-400'); });
        document.querySelectorAll('#panel [data-type]').forEach(function (r) { r.classList.toggle('hidden', !!tb.dataset.t && r.dataset.type !== tb.dataset.t); });
      }
    });
  });
})();
</script>
