<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Công nợ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body class="opacity-0 transition-opacity">
<script>
  // Một trang cho cả 2 loại công nợ: ?loai=thu (131) | ?loai=tra (331)
  var LOAI = new URLSearchParams(location.search).get('loai') === 'thu' ? 'thu' : 'tra';
  document.body.setAttribute('data-page', LOAI === 'thu' ? 'phai-thu' : 'phai-tra');
</script>

<div id="page">
  <!-- Tiêu đề -->
  <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
    <div>
      <nav class="mb-1 flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
        <span>Tổng quan</span><i data-icon="chevronRight" class="h-3.5 w-3.5"></i><span id="crumb"></span>
      </nav>
      <h1 id="title" class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white"></h1>
      <p id="subtitle" class="mt-1 text-sm text-slate-500 dark:text-slate-400"></p>
    </div>
    <button class="btn" onclick="App.toast('Đang xuất Excel…')"><i data-icon="download" class="h-4 w-4"></i>Xuất Excel</button>
  </div>

  <!-- Bộ lọc -->
  <section class="card mt-6 p-4">
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-[1.3fr_1fr_1fr_1fr_auto] lg:items-end">
      <label class="block"><span class="mb-1.5 block text-xs font-medium text-slate-500 dark:text-slate-400">Số hiệu tài khoản</span>
        <select id="acc" class="inp"></select></label>
      <label class="block"><span class="mb-1.5 block text-xs font-medium text-slate-500 dark:text-slate-400">Từ ngày</span>
        <input id="from" type="date" class="inp" value="2026-10-01"></label>
      <label class="block"><span class="mb-1.5 block text-xs font-medium text-slate-500 dark:text-slate-400">Đến ngày</span>
        <input id="to" type="date" class="inp" value="2026-10-31"></label>
      <label class="block"><span class="mb-1.5 block text-xs font-medium text-slate-500 dark:text-slate-400">Loại đối tượng</span>
        <select id="otype" class="inp">
          <option value="">Tất cả</option>
          <option value="3">Công ty</option>
          <option value="2">Khách hàng</option>
          <option value="1">Nhân viên</option>
        </select></label>
      <button id="btn-search" class="btn-primary h-[38px]"><i data-icon="search" class="h-4 w-4"></i>Xem</button>
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
      <span class="text-slate-500 dark:text-slate-400">Chọn nhanh:</span>
      <button class="rounded-full border border-slate-200 px-2.5 py-1 hover:border-brand-300 hover:bg-brand-50 dark:border-slate-700 dark:hover:bg-slate-800" data-p="month">Tháng này</button>
      <button class="rounded-full border border-slate-200 px-2.5 py-1 hover:border-brand-300 hover:bg-brand-50 dark:border-slate-700 dark:hover:bg-slate-800" data-p="prev">Tháng trước</button>
      <button class="rounded-full border border-slate-200 px-2.5 py-1 hover:border-brand-300 hover:bg-brand-50 dark:border-slate-700 dark:hover:bg-slate-800" data-p="quarter">Quý này</button>
      <button class="rounded-full border border-slate-200 px-2.5 py-1 hover:border-brand-300 hover:bg-brand-50 dark:border-slate-700 dark:hover:bg-slate-800" data-p="year">Năm nay</button>
    </div>
  </section>

  <!-- Thẻ tổng hợp -->
  <div id="stats" class="mt-6 grid grid-cols-2 gap-3 lg:grid-cols-4"></div>

  <!-- Bảng -->
  <section class="card mt-6 overflow-hidden">
    <div class="flex flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:px-5">
      <div class="relative sm:w-80">
        <i data-icon="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input id="q" class="inp pl-9" placeholder="Tìm mã hoặc tên đối tượng…">
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
        <input type="checkbox" id="hide-zero" class="h-4 w-4 accent-brand-600" checked>Ẩn đối tượng không có số dư, phát sinh
      </label>
      <span id="count" class="text-sm text-slate-500 sm:ml-auto dark:text-slate-400"></span>
    </div>

    <div class="max-h-[65vh] overflow-auto border-t border-slate-200 scrollbar-thin dark:border-slate-800">
      <table class="w-full min-w-[980px] text-sm">
        <thead class="sticky top-0 z-20 bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:bg-slate-800 dark:text-slate-400">
          <tr>
            <th rowspan="2" class="sticky left-0 z-10 bg-slate-50 px-4 py-2.5 text-left dark:bg-slate-800" data-sort="code">Mã</th>
            <th rowspan="2" class="px-4 py-2.5 text-left" data-sort="name">Tên đối tượng</th>
            <th colspan="2" class="border-x border-b border-slate-200 px-4 py-2 text-center dark:border-slate-700">Số dư đầu kỳ</th>
            <th colspan="2" class="border-x border-b border-slate-200 px-4 py-2 text-center dark:border-slate-700">Phát sinh trong kỳ</th>
            <th colspan="2" class="border-x border-b border-slate-200 px-4 py-2 text-center dark:border-slate-700">Số dư cuối kỳ</th>
            <th rowspan="2" class="px-4 py-2.5 text-center">Chi tiết</th>
          </tr>
          <tr>
            <th class="border-l border-slate-200 px-4 py-2 text-right dark:border-slate-700" data-sort="oN">Nợ</th>
            <th class="border-r border-slate-200 px-4 py-2 text-right dark:border-slate-700" data-sort="oC">Có</th>
            <th class="px-4 py-2 text-right" data-sort="pN">Nợ</th>
            <th class="border-r border-slate-200 px-4 py-2 text-right dark:border-slate-700" data-sort="pC">Có</th>
            <th class="px-4 py-2 text-right" data-sort="cN">Nợ</th>
            <th class="border-r border-slate-200 px-4 py-2 text-right dark:border-slate-700" data-sort="cC">Có</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
        <tfoot id="foot" class="sticky bottom-0 z-20 border-t-2 border-slate-200 bg-slate-50 font-semibold dark:border-slate-700 dark:bg-slate-800"></tfoot>
      </table>
    </div>
    <div id="empty" class="hidden border-t border-slate-200 py-12 text-center text-sm text-slate-500 dark:border-slate-800">Không có đối tượng nào phù hợp.</div>
  </section>
</div>

<script>
(function () {
  var E = App.esc, I = App.icon, M = App.money;

  var CFG = {
    thu: {
      title: 'Phải thu khách hàng', crumb: 'Phải thu khách hàng',
      sub: 'Công nợ phải thu theo từng đối tượng (TK 131). Số dư <b>Nợ</b> = khách còn nợ, <b>Có</b> = khách trả trước.',
      accounts: [['1311000', 'Phải thu khách hàng'], ['131', 'Phải thu của khách hàng (tổng hợp)']],
      side: 'N', // số dư bình thường bên Nợ
      names: [
        [3, 'Công ty TNHH Sự Kiện Ánh Dương'], [3, 'Công ty CP Đầu tư Phú Mỹ Hưng'], [3, 'Ngân hàng TMCP Á Châu – CN Q1'],
        [3, 'Công ty TNHH Unilever Việt Nam'], [3, 'Khách sạn Rex Sài Gòn'], [3, 'Công ty CP Vinamilk'],
        [3, 'Trường Quốc tế Úc (AIS)'], [3, 'Công ty TNHH Samsung Vina'], [2, 'Khách lẻ'],
        [2, 'Chị Ngọc Anh – Q7'], [2, 'Anh Tuấn – Thảo Điền'], [2, 'Chị Mai Phương (khách VIP)'],
        [3, 'Bệnh viện FV'], [3, 'Công ty TNHH Nestlé Việt Nam'], [2, 'Chị Hồng Nhung – Hà Nội'],
        [3, 'Công ty CP Color Life'], [1, 'Nguyễn Thị Lan (NV)']
      ]
    },
    tra: {
      title: 'Phải trả người bán', crumb: 'Phải trả người bán',
      sub: 'Công nợ phải trả theo từng nhà cung cấp (TK 331). Số dư <b>Có</b> = còn phải trả, <b>Nợ</b> = đã ứng trước.',
      accounts: [['3311000', 'Phải trả nhà cung cấp'], ['331', 'Phải trả cho người bán (tổng hợp)']],
      side: 'C',
      names: [
        [3, '(Vườn) Lâm Ly'], [3, '[Nhà cung cấp] Cường Giấy'], [3, '[Vườn] Anh Nhựt'], [3, '[Vườn] Chị Hà'],
        [3, '[Chợ Đà Lạt] Kim Hoa'], [3, '[Mặt bằng] 17 Trần Khánh Dư'], [3, '[Nhà vườn] Anh Phương Đà Lạt'],
        [3, '[Nhà vườn] Anh Phương Sakata'], [3, '[Nhà vườn] Cô Thu Đà Lạt'], [3, '[Nhà vườn] Chị Thúy Đà Lạt'],
        [3, '[Nhà vườn] Chú Ngân'], [3, '[Nhà vườn] Chú Phương'], [3, '[Nhà vườn] Dương Thị Cúc'],
        [3, '[Nhà vườn] Đỗ Hải Quân'], [3, '[Giao hàng] Ahamove'], [3, '[Bao bì] Hộp Quà Việt'],
        [3, '[Quảng cáo] Google Asia Pacific'], [1, 'Trần Văn Minh (NV – ứng mua hoa)']
      ]
    }
  }[LOAI];

  var OTYPE = { 1: 'Nhân viên', 2: 'Khách hàng', 3: 'Công ty' };

  function rnd(seed) {
    var x = 7;
    for (var i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) % 2147483647;
    return function () { x = (x * 48271) % 2147483647; return x / 2147483647; };
  }

  // Mỗi dòng: số dư đầu kỳ (Nợ/Có), phát sinh (Nợ/Có) → cuối kỳ = bù trừ về 1 bên
  // (thực tế: tổng bút toán theo đối tượng của chứng từ, trước kỳ và trong kỳ)
  function build() {
    var seedP = document.getElementById('from').value + document.getElementById('to').value;
    var normal = CFG.side;
    return CFG.names.map(function (n, i) {
      var r = rnd(n[1] + seedP);
      var code = String([16307, 13997, 14688, 14704, 12787, 5029, 4352, 12759, 4353, 4383, 12603, 12696, 24144, 14245, 3021, 8810, 9902, 31426][i] || (10000 + i * 731));
      var zero = r() < 0.2;
      var open = zero ? 0 : Math.round(r() * 150000) * 1000 * (r() < 0.25 ? 0.05 : 1);
      var opp = r() < 0.12;                       // số dư ngược bên (trả trước / ứng trước)
      var inc = zero ? 0 : (r() < 0.35 ? 0 : Math.round(r() * 80000) * 1000);
      var dec = zero ? 0 : (r() < 0.3 ? 0 : Math.min(open + inc, Math.round(r() * 90000) * 1000));
      var oN = 0, oC = 0, pN = 0, pC = 0;
      if (normal === 'C') { if (opp) oN = open; else oC = open; pC = inc; pN = dec; }
      else { if (opp) oC = open; else oN = open; pN = inc; pC = dec; }
      var net = (oN - oC) + (pN - pC);
      return { code: code, name: n[1], type: n[0], oN: oN, oC: oC, pN: pN, pC: pC, cN: net > 0 ? net : 0, cC: net < 0 ? -net : 0 };
    });
  }

  var data = [], sortKey = null, sortDir = 1;

  function sum(list, k) { return list.reduce(function (s, x) { return s + x[k]; }, 0); }
  function amt(v, cls) { return v ? '<span class="' + (cls || '') + '">' + M(v) + '</span>' : '<span class="text-slate-300 dark:text-slate-600">–</span>'; }

  function stats() {
    var thu = LOAI === 'thu';
    var main = thu ? sum(data, 'cN') : sum(data, 'cC');
    var opp = thu ? sum(data, 'cC') : sum(data, 'cN');
    var inc = thu ? sum(data, 'pN') : sum(data, 'pC');
    var dec = thu ? sum(data, 'pC') : sum(data, 'pN');
    var owing = data.filter(function (x) { return thu ? x.cN > 0 : x.cC > 0; }).length;
    var cards = [
      [thu ? 'Khách còn nợ (cuối kỳ)' : 'Còn phải trả (cuối kỳ)', M(main), owing + ' đối tượng', thu ? 'download' : 'upload', thu ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300' : 'bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300'],
      [thu ? 'Phát sinh tăng (bán chịu)' : 'Phát sinh tăng (mua chịu)', M(inc), 'Trong kỳ', 'plus', 'bg-brand-100 text-brand-600 dark:bg-brand-500/15 dark:text-brand-300'],
      [thu ? 'Đã thu trong kỳ' : 'Đã trả trong kỳ', M(dec), 'Trong kỳ', 'check', 'bg-sky-100 text-sky-600 dark:bg-sky-500/15 dark:text-sky-300'],
      [thu ? 'Khách trả trước' : 'Đã ứng trước NCC', M(opp), 'Số dư ngược bên', 'refund', 'bg-amber-100 text-amber-600 dark:bg-amber-500/15 dark:text-amber-300']
    ];
    document.getElementById('stats').innerHTML = cards.map(function (c) {
      return '<div class="card p-4"><div class="flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400">' +
        '<span class="grid h-7 w-7 shrink-0 place-items-center rounded-lg ' + c[4] + '">' + I(c[3], 'h-4 w-4') + '</span>' + c[0] + '</div>' +
        '<div class="num mt-2 text-[15px] font-bold text-slate-900 dark:text-white sm:text-xl">' + c[1] + '</div>' +
        '<div class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">' + c[2] + '</div></div>';
    }).join('');
  }

  function render() {
    var q = App.normalize(document.getElementById('q').value.trim());
    var t = document.getElementById('otype').value;
    var hide = document.getElementById('hide-zero').checked;
    var list = data.filter(function (r) {
      if (q && App.normalize(r.code + ' ' + r.name).indexOf(q) < 0) return false;
      if (t && String(r.type) !== t) return false;
      if (hide && !r.oN && !r.oC && !r.pN && !r.pC) return false;
      return true;
    });
    if (sortKey) list = list.slice().sort(function (a, b) { return (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir; });

    var mainSide = LOAI === 'thu' ? 'cN' : 'cC';
    document.getElementById('rows').innerHTML = list.map(function (r) {
      return '<tr class="group transition hover:bg-brand-50/40 dark:hover:bg-slate-800/40">' +
        '<td class="sticky left-0 bg-white px-4 py-2.5 group-hover:bg-brand-50 dark:bg-slate-900 dark:group-hover:bg-slate-800"><span class="num font-mono text-xs text-slate-500">' + r.code + '</span></td>' +
        '<td class="px-4 py-2.5"><div class="font-medium text-slate-800 dark:text-slate-100">' + E(r.name) + '</div><div class="text-[11px] text-slate-400">' + OTYPE[r.type] + '</div></td>' +
        '<td class="num border-l border-slate-100 px-4 py-2.5 text-right dark:border-slate-800">' + amt(r.oN) + '</td>' +
        '<td class="num border-r border-slate-100 px-4 py-2.5 text-right dark:border-slate-800">' + amt(r.oC) + '</td>' +
        '<td class="num px-4 py-2.5 text-right">' + amt(r.pN, 'text-sky-700 dark:text-sky-300') + '</td>' +
        '<td class="num border-r border-slate-100 px-4 py-2.5 text-right dark:border-slate-800">' + amt(r.pC, 'text-sky-700 dark:text-sky-300') + '</td>' +
        '<td class="num px-4 py-2.5 text-right font-semibold">' + amt(r.cN, mainSide === 'cN' ? 'text-slate-900 dark:text-white' : 'text-amber-600 dark:text-amber-400') + '</td>' +
        '<td class="num border-r border-slate-100 px-4 py-2.5 text-right font-semibold dark:border-slate-800">' + amt(r.cC, mainSide === 'cC' ? 'text-slate-900 dark:text-white' : 'text-amber-600 dark:text-amber-400') + '</td>' +
        '<td class="px-3 py-2.5 text-center"><a href="dang-phat-trien.html?m=' + encodeURIComponent('Chi tiết công nợ – ' + r.name) + '" class="inline-flex items-center gap-1 rounded-lg px-2 py-1 text-xs font-semibold text-brand-600 hover:bg-brand-50 dark:text-brand-300 dark:hover:bg-brand-500/10">Xem' + I('chevronRight', 'h-3.5 w-3.5') + '</a></td>' +
      '</tr>';
    }).join('');

    var cell = 'num px-4 py-3 text-right';
    document.getElementById('foot').innerHTML = list.length ? '<tr>' +
      '<td colspan="2" class="sticky left-0 bg-slate-50 px-4 py-3 dark:bg-slate-800">Tổng cộng</td>' +
      '<td class="' + cell + ' border-l border-slate-200 dark:border-slate-700">' + M(sum(list, 'oN')) + '</td>' +
      '<td class="' + cell + ' border-r border-slate-200 dark:border-slate-700">' + M(sum(list, 'oC')) + '</td>' +
      '<td class="' + cell + '">' + M(sum(list, 'pN')) + '</td>' +
      '<td class="' + cell + ' border-r border-slate-200 dark:border-slate-700">' + M(sum(list, 'pC')) + '</td>' +
      '<td class="' + cell + '">' + M(sum(list, 'cN')) + '</td>' +
      '<td class="' + cell + ' border-r border-slate-200 dark:border-slate-700">' + M(sum(list, 'cC')) + '</td><td></td></tr>' : '';

    document.getElementById('empty').classList.toggle('hidden', list.length > 0);
    document.getElementById('count').textContent = list.length + ' / ' + data.length + ' đối tượng';
    document.querySelectorAll('[data-sort]').forEach(function (th) {
      th.style.cursor = 'pointer'; th.title = 'Bấm để sắp xếp';
      th.innerHTML = th.innerHTML.replace(/ [↑↓]$/, '') + (sortKey === th.dataset.sort ? (sortDir > 0 ? ' ↑' : ' ↓') : '');
    });
  }

  function load() { data = build(); stats(); render(); }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  document.addEventListener('DOMContentLoaded', function () {
    document.title = CFG.title;
    document.getElementById('title').textContent = CFG.title;
    document.getElementById('crumb').textContent = CFG.crumb;
    document.getElementById('subtitle').innerHTML = CFG.sub;
    document.getElementById('acc').innerHTML = CFG.accounts.map(function (a) { return '<option value="' + a[0] + '">' + a[0] + ' – ' + E(a[1]) + '</option>'; }).join('');
    var now = new Date();
    document.getElementById('from').value = iso(new Date(now.getFullYear(), now.getMonth(), 1));
    document.getElementById('to').value = iso(new Date(now.getFullYear(), now.getMonth() + 1, 0));
    load();

    document.getElementById('btn-search').onclick = load;
    document.getElementById('otype').addEventListener('change', render);
    document.getElementById('q').addEventListener('input', render);
    document.getElementById('hide-zero').addEventListener('change', render);
    document.querySelector('[data-p]').parentNode.addEventListener('click', function (e) {
      var b = e.target.closest('[data-p]'); if (!b) return;
      var y = now.getFullYear(), m = now.getMonth(), f, t;
      if (b.dataset.p === 'month') { f = new Date(y, m, 1); t = new Date(y, m + 1, 0); }
      if (b.dataset.p === 'prev') { f = new Date(y, m - 1, 1); t = new Date(y, m, 0); }
      if (b.dataset.p === 'quarter') { var q = Math.floor(m / 3) * 3; f = new Date(y, q, 1); t = new Date(y, q + 3, 0); }
      if (b.dataset.p === 'year') { f = new Date(y, 0, 1); t = new Date(y, 11, 31); }
      document.getElementById('from').value = iso(f);
      document.getElementById('to').value = iso(t);
      load();
    });
    document.querySelector('thead').addEventListener('click', function (e) {
      var th = e.target.closest('[data-sort]'); if (!th) return;
      if (sortKey === th.dataset.sort) sortDir = -sortDir;
      else { sortKey = th.dataset.sort; sortDir = /^(code|name)$/.test(sortKey) ? 1 : -1; }
      render();
    });
  });
})();
</script>
</body>
</html>
