<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sổ quỹ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="assets/tw-config.js"></script>
  <script src="assets/app.js"></script>
</head>
<body data-page="tong-quan" class="opacity-0 transition-opacity">

<div id="page">
  <!-- Tiêu đề + chọn kỳ -->
  <div class="flex flex-col gap-4 xl:flex-row xl:items-end xl:justify-between">
    <div>
      <nav class="mb-1 flex items-center gap-1.5 text-xs text-slate-500 dark:text-slate-400">
        <span>Tổng quan</span><i data-icon="chevronRight" class="h-3.5 w-3.5"></i><span>Sổ quỹ</span>
      </nav>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Sổ quỹ tiền mặt / ngân hàng</h1>
      <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">Số dư và phát sinh thu chi của sổ quỹ trong kỳ <b id="period-label" class="font-semibold text-slate-700 dark:text-slate-200"></b></p>
    </div>
    <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
      <div class="inline-flex overflow-x-auto [scrollbar-width:none] rounded-lg bg-slate-100 p-0.5 text-sm font-medium dark:bg-slate-800" id="presets">
        <button data-p="today">Hôm nay</button>
        <button data-p="month">Tháng này</button>
        <button data-p="quarter">Quý này</button>
        <button data-p="year">Năm nay</button>
      </div>
      <div class="flex items-center gap-2">
        <input type="date" id="from" class="inp min-w-0 flex-1 sm:w-40 sm:flex-none">
        <span class="text-slate-400">→</span>
        <input type="date" id="to" class="inp min-w-0 flex-1 sm:w-40 sm:flex-none">
      </div>
    </div>
  </div>

  <!-- Thẻ tổng hợp -->
  <div id="stats" class="mt-6 grid grid-cols-2 gap-3 lg:grid-cols-4"></div>

  <!-- Bảng sổ quỹ -->
  <section class="card mt-6 overflow-hidden">
    <!-- Tabs -->
    <div class="flex gap-6 overflow-x-auto [scrollbar-width:none] border-b border-slate-200 px-4 pt-3 dark:border-slate-800 sm:px-5" id="tabs">
      <button class="tab flex items-center gap-2" data-tab="cash"><i data-icon="cash" class="h-4 w-4"></i>Sổ quỹ tiền mặt <span class="badge bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400" id="n-cash"></span></button>
      <button class="tab flex items-center gap-2" data-tab="bank"><i data-icon="bank" class="h-4 w-4"></i>Sổ quỹ ngân hàng <span class="badge bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-400" id="n-bank"></span></button>
    </div>

    <!-- Thanh công cụ -->
    <div class="flex flex-col gap-3 px-4 py-3 sm:flex-row sm:items-center sm:px-5">
      <div class="relative sm:w-80">
        <i data-icon="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
        <input id="q" class="inp pl-9" placeholder="Tìm mã hoặc tên tài khoản…">
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300">
        <input type="checkbox" id="hide-zero" class="h-4 w-4 accent-brand-600">Ẩn tài khoản không có số dư, phát sinh
      </label>
      <button class="btn sm:ml-auto" onclick="App.toast('Đang xuất Excel…')"><i data-icon="download" class="h-4 w-4"></i>Xuất Excel</button>
    </div>

    <!-- Bảng -->
    <div class="overflow-x-auto border-t border-slate-200 dark:border-slate-800">
      <table class="w-full min-w-[900px] text-sm">
        <thead class="bg-slate-50 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:bg-slate-800/60 dark:text-slate-400">
          <tr>
            <th rowspan="2" class="sticky left-0 z-10 bg-slate-50 px-4 py-2.5 text-left dark:bg-slate-800" data-sort="0">Mã TK</th>
            <th rowspan="2" class="px-4 py-2.5 text-left" data-sort="1">Tên tài khoản</th>
            <th rowspan="2" class="border-l border-slate-200 px-4 py-2.5 text-right dark:border-slate-700" data-sort="2">Số dư đầu kỳ</th>
            <th colspan="2" class="border-x border-b border-slate-200 px-4 py-2 text-center dark:border-slate-700">Phát sinh trong kỳ</th>
            <th rowspan="2" class="px-4 py-2.5 text-right" data-sort="5">Số dư cuối kỳ</th>
            <th rowspan="2" class="border-l border-slate-200 px-4 py-2.5 text-center dark:border-slate-700">Sổ chi tiết</th>
          </tr>
          <tr>
            <th class="border-l border-slate-200 px-4 py-2 text-right text-emerald-600 dark:border-slate-700 dark:text-emerald-400" data-sort="3">Thu</th>
            <th class="border-r border-slate-200 px-4 py-2 text-right text-rose-600 dark:border-slate-700 dark:text-rose-400" data-sort="4">Chi</th>
          </tr>
        </thead>
        <tbody id="rows" class="divide-y divide-slate-100 dark:divide-slate-800"></tbody>
        <tfoot id="foot" class="border-t-2 border-slate-200 bg-slate-50 font-semibold dark:border-slate-700 dark:bg-slate-800/60"></tfoot>
      </table>
    </div>
    <div id="empty" class="hidden border-t border-slate-200 py-12 text-center text-sm text-slate-500 dark:border-slate-800">Không có tài khoản nào phù hợp.</div>
  </section>
  <p class="mt-3 text-xs text-slate-400">Số tiền tính bằng VND. Tài khoản ngoại tệ được quy đổi theo giá trị ghi sổ.</p>
</div>

<script>
(function () {
  var E = App.esc, I = App.icon, M = App.money;

  // ---- Sinh số liệu mẫu ổn định theo mã TK + kỳ (thực tế: SUM bút toán ACCEntries theo kỳ)
  function rnd(seed) {
    var x = 0;
    for (var i = 0; i < seed.length; i++) x = (x * 31 + seed.charCodeAt(i)) % 2147483647;
    return function () { x = (x * 48271) % 2147483647; return x / 2147483647; };
  }
  var SCALE = { today: 0.04, month: 1, quarter: 3, year: 10, custom: 1.5 };
  function build(list, kind, preset) {
    return list.map(function (a) {
      var r = rnd(a[0] + preset);
      var big = kind === 'bank' ? 1 : 0.25;
      var idle = r() < 0.18;                                   // TK không phát sinh
      var open = Math.round(r() * 900 * big) * 1e6 * (r() < 0.3 ? 0.1 : 1);
      var thu = idle ? 0 : Math.round(r() * 1200 * big * SCALE[preset]) * 1e5;
      var chi = idle ? 0 : Math.round(thu * (0.55 + r() * 0.6) / 1e5) * 1e5;
      if (r() < 0.1) open = 0;
      return { code: a[0], name: a[1], cur: a[2] || 'VND', open: open, thu: thu, chi: chi, close: open + thu - chi };
    });
  }

  var state = { tab: 'cash', preset: 'month', sort: null, dir: 1 };
  var data = {};

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function vn(s) { var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function setPreset(p) {
    var now = new Date(), from = new Date(now), to = new Date(now);
    if (p === 'month') { from = new Date(now.getFullYear(), now.getMonth(), 1); to = new Date(now.getFullYear(), now.getMonth() + 1, 0); }
    if (p === 'quarter') { var q = Math.floor(now.getMonth() / 3) * 3; from = new Date(now.getFullYear(), q, 1); to = new Date(now.getFullYear(), q + 3, 0); }
    if (p === 'year') { from = new Date(now.getFullYear(), 0, 1); to = new Date(now.getFullYear(), 11, 31); }
    document.getElementById('from').value = iso(from);
    document.getElementById('to').value = iso(to);
    load(p);
  }
  function load(p) {
    state.preset = p;
    document.querySelectorAll('#presets [data-p]').forEach(function (b) {
      b.className = 'whitespace-nowrap rounded-md px-3 py-1.5 ' + (b.dataset.p === p ? 'bg-white text-slate-900 shadow-sm dark:bg-slate-700 dark:text-white' : 'text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-white');
    });
    document.getElementById('period-label').textContent = vn(document.getElementById('from').value) + ' – ' + vn(document.getElementById('to').value);
    data.cash = build(App.cash, 'cash', p);
    data.bank = build(App.bank, 'bank', p);
    stats(); render();
  }

  function sum(list, k) { return list.reduce(function (s, x) { return s + x[k]; }, 0); }

  function stats() {
    var c = data.cash, b = data.bank, all = c.concat(b);
    var cards = [
      ['Tiền mặt cuối kỳ', sum(c, 'close'), sum(c, 'close') - sum(c, 'open'), 'cash', 'bg-emerald-100 text-emerald-600 dark:bg-emerald-500/15 dark:text-emerald-300'],
      ['Ngân hàng cuối kỳ', sum(b, 'close'), sum(b, 'close') - sum(b, 'open'), 'bank', 'bg-sky-100 text-sky-600 dark:bg-sky-500/15 dark:text-sky-300'],
      ['Tổng thu trong kỳ', sum(all, 'thu'), null, 'download', 'bg-brand-100 text-brand-600 dark:bg-brand-500/15 dark:text-brand-300'],
      ['Tổng chi trong kỳ', sum(all, 'chi'), null, 'upload', 'bg-rose-100 text-rose-600 dark:bg-rose-500/15 dark:text-rose-300']
    ];
    document.getElementById('stats').innerHTML = cards.map(function (x) {
      var delta = x[2] === null ? '' :
        '<div class="mt-1 text-xs ' + (x[2] >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400') + '">' +
        (x[2] >= 0 ? '▲ ' : '▼ ') + M(Math.abs(x[2])) + ' so với đầu kỳ</div>';
      return '<div class="card p-4"><div class="flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400">' +
        '<span class="grid h-7 w-7 place-items-center rounded-lg ' + x[4] + '">' + I(x[3], 'h-4 w-4') + '</span>' + x[0] + '</div>' +
        '<div class="num mt-2 text-[15px] font-bold text-slate-900 dark:text-white sm:text-xl">' + M(x[1]) + '</div>' + delta + '</div>';
    }).join('');
  }

  function amt(v, cls) {
    return v === 0 ? '<span class="text-slate-300 dark:text-slate-600">–</span>' : '<span class="' + (cls || '') + '">' + M(v) + '</span>';
  }

  function render() {
    document.getElementById('n-cash').textContent = data.cash.length;
    document.getElementById('n-bank').textContent = data.bank.length;
    document.querySelectorAll('#tabs [data-tab]').forEach(function (b) { b.classList.toggle('tab-active', b.dataset.tab === state.tab); });

    var q = App.normalize(document.getElementById('q').value.trim());
    var hide = document.getElementById('hide-zero').checked;
    var list = data[state.tab].filter(function (r) {
      if (q && App.normalize(r.code + ' ' + r.name).indexOf(q) < 0) return false;
      if (hide && !r.open && !r.thu && !r.chi) return false;
      return true;
    });
    if (state.sort !== null) {
      var key = ['code', 'name', 'open', 'thu', 'chi', 'close'][state.sort];
      list = list.slice().sort(function (a, b) { return (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * state.dir; });
    }

    document.getElementById('rows').innerHTML = list.map(function (r) {
      return '<tr class="group transition hover:bg-brand-50/40 dark:hover:bg-slate-800/40">' +
        '<td class="sticky left-0 bg-white px-4 py-2.5 group-hover:bg-brand-50 dark:bg-slate-900 dark:group-hover:bg-slate-800"><span class="num rounded-md bg-slate-100 px-1.5 py-0.5 font-mono text-xs font-medium text-slate-600 dark:bg-slate-800 dark:text-slate-300">' + r.code + '</span></td>' +
        '<td class="px-4 py-2.5 text-slate-800 dark:text-slate-100">' + E(r.name) + (r.cur !== 'VND' ? ' <span class="badge ml-1 bg-sky-50 text-sky-700 dark:bg-sky-500/10 dark:text-sky-300">' + r.cur + '</span>' : '') + '</td>' +
        '<td class="num border-l border-slate-100 px-4 py-2.5 text-right dark:border-slate-800">' + amt(r.open) + '</td>' +
        '<td class="num border-l border-slate-100 px-4 py-2.5 text-right dark:border-slate-800">' + amt(r.thu, 'text-emerald-600 dark:text-emerald-400') + '</td>' +
        '<td class="num border-r border-slate-100 px-4 py-2.5 text-right dark:border-slate-800">' + amt(r.chi, 'text-rose-600 dark:text-rose-400') + '</td>' +
        '<td class="num px-4 py-2.5 text-right font-semibold">' + amt(r.close, r.close < 0 ? 'text-rose-600' : 'text-slate-900 dark:text-white') + '</td>' +
        '<td class="border-l border-slate-100 px-4 py-2.5 text-center dark:border-slate-800">' +
          '<a href="dang-phat-trien.html?m=' + encodeURIComponent('Sổ chi tiết ' + r.code + ' – ' + r.name) + '" class="inline-flex items-center gap-1 rounded-lg px-2 py-1 text-xs font-semibold text-brand-600 hover:bg-brand-50 dark:text-brand-300 dark:hover:bg-brand-500/10">Xem sổ' + I('chevronRight', 'h-3.5 w-3.5') + '</a></td>' +
      '</tr>';
    }).join('');

    document.getElementById('empty').classList.toggle('hidden', list.length > 0);
    document.getElementById('foot').innerHTML = list.length ? '<tr>' +
      '<td class="sticky left-0 bg-slate-50 px-4 py-3 dark:bg-slate-800" colspan="2">Tổng cộng (' + list.length + ' tài khoản)</td>' +
      '<td class="num border-l border-slate-200 px-4 py-3 text-right dark:border-slate-700">' + M(sum(list, 'open')) + '</td>' +
      '<td class="num border-l border-slate-200 px-4 py-3 text-right text-emerald-600 dark:border-slate-700 dark:text-emerald-400">' + M(sum(list, 'thu')) + '</td>' +
      '<td class="num border-r border-slate-200 px-4 py-3 text-right text-rose-600 dark:border-slate-700 dark:text-rose-400">' + M(sum(list, 'chi')) + '</td>' +
      '<td class="num px-4 py-3 text-right text-slate-900 dark:text-white">' + M(sum(list, 'close')) + '</td><td class="border-l border-slate-200 dark:border-slate-700"></td></tr>' : '';

    document.querySelectorAll('[data-sort]').forEach(function (th) {
      var on = state.sort === +th.dataset.sort;
      th.style.cursor = 'pointer';
      th.title = 'Bấm để sắp xếp';
      th.dataset.arrow = on ? (state.dir > 0 ? ' ↑' : ' ↓') : '';
      th.innerHTML = th.innerHTML.replace(/ [↑↓]$/, '') + th.dataset.arrow;
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    setPreset('month');
    document.getElementById('presets').addEventListener('click', function (e) {
      var b = e.target.closest('[data-p]'); if (b) setPreset(b.dataset.p);
    });
    ['from', 'to'].forEach(function (id) {
      document.getElementById(id).addEventListener('change', function () { load('custom'); });
    });
    document.getElementById('tabs').addEventListener('click', function (e) {
      var t = e.target.closest('[data-tab]'); if (!t) return;
      state.tab = t.dataset.tab; state.sort = null; render();
    });
    document.getElementById('q').addEventListener('input', render);
    document.getElementById('hide-zero').addEventListener('change', render);
    document.querySelector('thead').addEventListener('click', function (e) {
      var th = e.target.closest('[data-sort]'); if (!th) return;
      var c = +th.dataset.sort;
      if (state.sort === c) state.dir = -state.dir; else { state.sort = c; state.dir = c >= 2 ? -1 : 1; }
      render();
    });
  });
})();
</script>
</body>
</html>
